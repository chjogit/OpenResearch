function inline(t) {
  return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])_([^_]+)_(?=$|[\s).,])/g, "$1<i>$2</i>");
}
function md(src) {
  const lines = src.split("\n"); let out = "", list = false, tbl = [];

    if (!tbl.length) return;

    if (/^<\/?details>$/.test(l)) { endList(); out += l; continue; }
    const sm = l.match(/^<summary>(.*)<\/summary>$/); if (sm) { out += "<summary>" + esc(sm[1]) + "</summary>"; continue; }
    const dm = l.match(/^<details><summary>(.*)<\/summary>$/); if (dm) { endList(); out += "<details><summary>" + esc(dm[1]) + "</summary>"; continue; }
    if (!l.trim()) { endList(); continue; }
    if (l.startsWith("### ")) { endList(); out += "<h4>" + inline(l.slice(4)) + "</h4>"; continue; }
    if (l === "---") { endList(); out += "<hr>"; continue; }
    if (l.startsWith("> ")) { endList(); out += "<blockquote>" + inline(l.slice(2)) + "</blockquote>"; continue; }
    if (/^[-*] /.test(l)) { if (!list) { out += "<ul>"; list = true; } out += "<li>" + inline(l.slice(2)) + "</li>"; continue; }
    endList(); out += "<p>" + inline(l) + "</p>";
  }
  endList(); flushT(); return out;
}

function askReset(q) {

async function askLive(q) {
  A.busy = true; setBusy(); askReset(q);
  $("#ask-trace").insertAdjacentHTML("beforeend", '<p class="note" id="ask-wait">처리 중… (질문당 수십 초~2분)</p>');
  try {
    const res = await fetch("/api/ask", {method: "POST", body: JSON.stringify({question: q})});
    const rd = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const {done, value} = await rd.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!line.trim()) continue;
        const o = JSON.parse(line), w = $("#ask-wait");
        if (w) w.remove();
        if (o.event) $("#ask-trace").insertAdjacentHTML("beforeend", stepHtml(o.event));
        else if (o.result) showFinal(o.result);
        else if (o.error) $("#ask-final").innerHTML = `<div class="card"><span class="badge b-bad">오류</span> ${esc(o.error)}</div>`;
      }
    }
  } catch (e) { $("#ask-final").innerHTML = `<div class="card"><span class="badge b-bad">서버 연결 실패</span> ${esc(String(e))}</div>`; }
  A.busy = false; setBusy();
}
async function askReplay(it) {
  A.busy = true; setBusy(); askReset(it.question);
  for (const e of it.result.trace) { $("#ask-trace").insertAdjacentHTML("beforeend", stepHtml(e)); await sleep(350); }
  showFinal(it.result); A.busy = false; setBusy();
}

  return `<div class="card"><h2>감성 사전 평가 (사람 라벨)</h2>
  <div class="kv"><div><small>사람 라벨</small><b>${fmt(e.n_labeled)}건</b></div><div><small>감성 대상(‘무관’ ${fmt(e.n_irrelevant)}건 제외)</small><b>${fmt(e.n_scored)}건</b></div>
  <div><small>사전 정확도</small><b>${e.accuracy}%</b></div><div><small>SW 검수 후 라벨 일치도(κ)</small><b>${e.kappa_fleiss}</b></div></div>
  <p class="note">라벨러 3명이 매긴 뒤 SW 가 검수했기 때문에 κ 는 독립적인 일치도가 아니라 ‘SW 검수 후 라벨 일치도’입니다. SW 확인 ${e.n_sw_resolved}건 반영. 검증 통과가 아니라 현재 수준을 잰 결과이며, 개선 전이라 감성 기반 추론은 건너뜁니다.</p>
  <h3>클래스별</h3><div class="tw"><table><tr><th>정답 클래스</th><th>정밀도</th><th>재현율</th><th>건수</th></tr>${cls.map(([k, v]) =>
    `<tr><td>${esc(k)}</td><td>${v.precision}</td><td>${v.recall}</td><td>${fmt(v.n)}</td></tr>`).join("")}</table></div>
  <p class="note">긍정 글의 절반 가까이를 중립으로 분류합니다(긍정 과소 탐지·중립 편향).</p>
  <h3>혼동 행렬</h3>${conf}
  <h3>출처별</h3><div class="tw"><table><tr><th>출처</th><th>대상 건수</th><th>정확도</th><th>‘무관’ 비율</th></tr>${e.by_source.map(r =>
    `<tr><td>${esc(r.source)}</td><td>${fmt(r.n)}</td><td>${r.accuracy}%</td><td>${r.irrelevant}%</td></tr>`).join("")}</table></div>
  <p class="note">${esc(e.source)}</p></div>`;
}
function outlookValid() {
  const o = D.outlookValidation; if (!o) return "";
  if (o.status !== "measured") return `<div class="card"><h2>전망 규칙(outlook-r1)과 적중률</h2><p class="note">${esc(o.note)}</p></div>`;
  const pc = x => x == null ? "-" : (x * 100).toFixed(1) + "%";
  const rows = o.rows.map(r => r.unverified
    ? `<tr><td>${esc(r.name)}</td><td colspan="7"><span class="badge b-warn">미검증</span> ${esc(r.unverified)}</td></tr>`
    : `<tr><td>${esc(r.name)}</td><td><span class="badge ${r.verdict === "edge" ? "b-ok" : "b-warn"}">${esc(r.verdictLabel || "")}</span></td><td><b>${pc(r.rate)}</b> <span class="note">(${pc((r.ci95 || [])[0])}~${pc((r.ci95 || [])[1])})</span></td><td>${fmt(r.n)}</td><td>${pc(r.neutralShare)}</td><td>${pc(r.baselines.alwaysPositive)}</td><td>${pc(r.baselines.momentum)}</td><td>${pc(r.baselines.random)}</td></tr>`).join("");
  return `<div class="card"><h2>전망 규칙(${esc(o.ruleVersion)})과 과거 적중률</h2>
  <p>20거래일 뒤 KOSPI 대비 초과수익률 부호가 긍정 결론이면 양수, 부정 결론이면 음수일 때 적중으로 셉니다. 중립 결론은 적중률에서 빼고 비율만 따로 봅니다. 규칙은 결과를 보고 고치지 않았습니다.</p>
  <div class="tw"><table><tr><th>에이전트</th><th>판정</th><th>적중률 (95% 구간)</th><th>판정 건수</th><th>중립 비율</th><th>기준선: 항상 긍정</th><th>기준선: 모멘텀</th><th>기준선: 무작위</th></tr>${rows}</table></div>
  <p class="note">기준: ${esc(o.basis)} · 기준선은 같은 표본에서 비교했습니다. 판정은 95% 구간 하한이 세 기준선 중 최고값보다 커야 '우위 있음'입니다. 아래 고정 문구가 결론 옆에 붙습니다. 측정 ${esc(o.generatedAt || "")}.</p>
  ${[...new Set(o.rows.map(r => r.notice).filter(Boolean))].map(n => `<p><b>${esc(n)}</b></p>`).join("")}
  <ul>${o.limits.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
  <p class="note">계산 방식·도출 과정: ${esc(o.doc)} · 다시 계산: <code>${esc(o.command || "")}</code></p></div>`;
}
(function () {
  const v = D.validation;
  $("#s-valid").innerHTML = perfCards() + `<div class="card"><h2>제거 문장 추이 (과거 측정 기록, 각 티켓 Comments 의 값)</h2><p class="note">${esc(v.note)}</p><div class="tw"><table><tr><th>단계</th><th>제거 문장 합계</th><th>범위</th><th>설명</th></tr>${v.rows.map(r =>
    `<tr><td>${esc(r.stage)}</td><td>${esc(r.removed_total)}</td><td>${esc(r.range)}</td><td>${esc(r.note)}</td></tr>`).join("")}</table></div></div>
  ${outlookValid()}
  ${sentEval()}
  <div class="card"><h2>무엇을 뜻하나</h2><ul>${v.meaning.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>`;
})();

showTab((location.hash || "#ask").slice(1).replace(/[^a-z]/g, "") || "ask");
if (!$("#s-" + (location.hash || "").slice(1))) showTab("ask");
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>CH 에이전트 시연 — 질문부터 답까지</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#1c2430;--mute:#5d6878;--line:#dde2ea;--acc:#1f5fbf;--accbg:#e8f0fc;--ok:#1b7a43;--okbg:#e6f4ec;--warn:#9a5b00;--warnbg:#fdf1dc;--bad:#a02828;--badbg:#fbe9e9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1a2029;--ink:#e6ebf2;--mute:#9aa6b6;--line:#2c3643;--acc:#7fb0ff;--accbg:#1c2c47;--ok:#6fd49a;--okbg:#17301f;--warn:#f0b45a;--warnbg:#3a2c12;--bad:#ff8c8c;--badbg:#3a1b1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow-wrap:anywhere}
header{padding:20px 16px 8px;max-width:1040px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:16px 0 6px}
.sub{color:var(--mute);font-size:13px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav div{max-width:1040px;margin:0 auto;padding:6px 16px;display:flex;gap:6px;flex-wrap:wrap}
button,select{font:inherit;color:inherit}
.tab,.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer}
.tab[aria-selected="true"],.chip[aria-pressed="true"]{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
main{max-width:1040px;margin:0 auto;padding:12px 16px 48px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow span.step{background:var(--accbg);color:var(--acc);border-radius:8px;padding:6px 10px;font-size:13px}
.flow span.arr{color:var(--mute)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 10px}
.ctl label.t{font-size:12px;color:var(--mute);display:block;margin-bottom:2px}
.grp{display:flex;gap:4px;flex-wrap:wrap}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;margin-right:4px}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-mute{background:var(--line);color:var(--mute)}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--accbg)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.kv div{background:var(--bg);border-radius:8px;padding:8px 10px}.kv b{display:block;font-size:18px}.kv small{color:var(--mute)}
.md blockquote{margin:6px 0;padding:4px 10px;border-left:3px solid var(--acc);color:var(--mute);background:var(--bg)}
.md p{margin:4px 0}.md ul{margin:4px 0;padding-left:20px}.md details{margin:6px 0}.md code{background:var(--bg);padding:0 4px;border-radius:4px;font-size:12px}
.md h4{margin:14px 0 4px;font-size:15px}.md hr{border:0;border-top:1px solid var(--line)}
.sub-tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.note{font-size:13px;color:var(--mute)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.brief .bt{font-size:15px;line-height:1.6;margin:6px 0}.cnt.over{color:var(--bad,#c33);font-weight:700}.ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.ol .card{margin:0}.ol h3{margin:0 0 6px}
.dir{display:inline-block;border-radius:8px;padding:2px 12px;font-weight:700;font-size:16px}
.step{border-left:4px solid var(--acc)}.step b{display:inline-block;margin-bottom:4px}.step code{font-size:12px;background:var(--bg);padding:0 4px;border-radius:4px}
.sent{display:inline}.sent .badge{margin-right:3px}.ansbox p{margin:6px 0}.evl{color:var(--acc);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--acc)}
tr.flash td{background:var(--warnbg)}.row{display:flex;gap:8px}.row input{flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.go{padding:8px 16px;background:var(--acc);color:#fff;border:0;border-radius:8px;cursor:pointer}.go:disabled{opacity:.5;cursor:default}
footer{max-width:1040px;margin:0 auto;padding:0 16px 24px;color:var(--mute);font-size:12px}
</style>
</head>
<body>
<header>
<h1>CH 에이전트 시연 — 자연어 질문 → 에이전트 작동 → 자연어 답</h1>
<div class="sub" id="metaline"></div>
</header>
<nav><div role="tablist" id="tabs"></div></nav>
<main>
<section id="s-ask"></section>
<section id="s-valid"></section>
<section id="s-overview"></section>
<section id="s-demo"></section>
</main>
<footer>서버(<code>python -m qa.server</code>)로 열면 질문이 실제 DB·LLM 으로 실행되고, 파일로 열면 저장된 실행 기록을 재생합니다. 숫자는 모두 실제 실행 결과 또는 측정 결과 파일에서 나옵니다. 종합 결론은 오케스트레이터(SW) 담당이며 투자 권유가 아닙니다.</footer>
<script id="payload" type="application/json">/*__DATA__*/null</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("payload").textContent);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = n => n == null ? "미적용" : Number(n).toLocaleString("ko-KR");
const TABS = [["ask", "1 질문하고 답 보기"], ["valid", "2 성능"], ["overview", "3 구조·데이터"], ["demo", "4 저장된 4종목 결과"]];
const st = {tk: D.tickers[0].ticker, ag: "3", ext: 0, lv: "L2", view: "screen"};

$("#metaline").textContent = `기준일 ${D.meta.asOf} · 생성 ${D.meta.generatedAt} · 실행 ${D.meta.runs}회 · LLM 호출 ${D.meta.llmCalls}회 · 계약 ${D.meta.contract} · 기준 커밋 ${esc(D.meta.commit || "-")}`;

function showTab(id) {
  document.querySelectorAll("main section").forEach(s => s.classList.toggle("on", s.id === "s-" + id));
  document.querySelectorAll("#tabs .tab").forEach(b => b.setAttribute("aria-selected", b.dataset.id === id));
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
}
$("#tabs").innerHTML = TABS.map(([id, t]) => `<button class="tab" role="tab" data-id="${id}">${t}</button>`).join("");
$("#tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) showTab(b.dataset.id); });

// ---- 간단 마크다운 (렌더러가 쓰는 문법만: 제목·굵게·기울임·코드·인용·목록·표·details)
function inline(t) {
  return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])_([^_]+)_(?=$|[\s).,])/g, "$1<i>$2</i>");
}
function md(src) {
  const lines = src.split("\n"); let out = "", list = false, tbl = [];
  const flushT = () => {
    if (!tbl.length) return;
    const rows = tbl.filter(r => !/^\|\s*-+/.test(r)).map(r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
    out += '<div class="tw"><table>' + rows.map((r, i) => "<tr>" + r.map(c => (i ? "<td>" : "<th>") + inline(c) + (i ? "</td>" : "</th>")).join("") + "</tr>").join("") + "</table></div>";
    tbl = [];
  };
  const endList = () => { if (list) { out += "</ul>"; list = false; } };
  for (const raw of lines) {
    const l = raw.trimEnd();
    if (l.startsWith("|")) { endList(); tbl.push(l); continue; }
    flushT();
    if (/^<\/?details>$/.test(l)) { endList(); out += l; continue; }
    const sm = l.match(/^<summary>(.*)<\/summary>$/); if (sm) { out += "<summary>" + esc(sm[1]) + "</summary>"; continue; }
    const dm = l.match(/^<details><summary>(.*)<\/summary>$/); if (dm) { endList(); out += "<details><summary>" + esc(dm[1]) + "</summary>"; continue; }
    if (!l.trim()) { endList(); continue; }
    if (l.startsWith("### ")) { endList(); out += "<h4>" + inline(l.slice(4)) + "</h4>"; continue; }
    if (l === "---") { endList(); out += "<hr>"; continue; }
    if (l.startsWith("> ")) { endList(); out += "<blockquote>" + inline(l.slice(2)) + "</blockquote>"; continue; }
    if (/^[-*] /.test(l)) { if (!list) { out += "<ul>"; list = true; } out += "<li>" + inline(l.slice(2)) + "</li>"; continue; }
    endList(); out += "<p>" + inline(l) + "</p>";
  }
  endList(); flushT(); return out;
}

// ---- 1 개요
$("#s-overview").innerHTML = `
<div class="card"><h2>한눈에</h2>
<div class="flow">${D.overview.flow.map((s, i) => (i ? '<span class="arr">→</span>' : "") + `<span class="step">${esc(s)}</span>`).join("")}</div>
<p class="note">수집한 자료를 DB 에 두고, 노드가 계산한 값만 장부로 만들어 LLM 이 문장을 쓰고, 점검을 통과한 문장만 계약(JSON)에 담아 오케스트레이터에 넘깁니다.</p></div>
<div class="card"><h2>지키는 원칙</h2><ul>${D.overview.principles.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>
<div class="card"><h2>에이전트와 노드</h2><div class="tw"><table><tr><th>노드</th><th>에이전트</th><th>종류</th></tr>
${D.overview.nodes.map(n => `<tr><td>${esc(n[0])}</td><td>${esc(n[1])}</td><td>${esc(n[2])}</td></tr>`).join("")}</table></div>
<p class="note">기본 노드는 항상, 확장 노드는 선택했을 때(요건 충족 시)만 실행됩니다. 요건이 안 맞으면 '건너뜀'과 이유가 계약에 남습니다.</p></div>
<div class="card"><h2>화면 보는 법</h2><p>‘1 질문하고 답 보기’에서 질문을 입력하면(서버 실행 시 실제 DB·LLM) 해석 → 도구·노드 실행 → RAG → 생성·검사 → 전망 → 답까지 단계별로 보입니다. ‘2 성능’은 측정값과 측정 방법·날짜·다시 재는 명령, ‘4 저장된 4종목 결과’는 종목 × 확장 켬/끔 실행 결과(${D.meta.runs}가지)입니다.</p></div>`;

// ---- 2 에이전트 시연
const evLabel = id => /^E\d+$/.test(id) ? `<span title="${esc(id)}">근거 ${parseInt(id.slice(1), 10)}</span>` : esc(id);
const NODE_TITLE = { N05: "거시 데이터 점검", N06: "거시 해석", N07: "수급 데이터 점검", N08: "수급 해석", N11: "심리·뉴스 데이터 점검", N12: "심리·뉴스 해석" };
const chip = (grp, val, label, on) => `<button class="chip" data-g="${grp}" data-v="${esc(val)}" aria-pressed="${on}">${esc(label)}</button>`;
function statusBadge(s) { return `<span class="badge ${/^완료/.test(s) ? "b-ok" : /대체/.test(s) ? "b-warn" : "b-bad"}">${esc(s)}</span>`; }
function nodeTable(r) {
  const ns = r.contract.nodes || [];
  if (!ns.length) return '<p class="note">노드 정보 없음</p>';
  return '<div class="tw"><table><tr><th>노드</th><th>종류</th><th>상태</th><th>결과</th><th>이유 · 미확보 입력</th></tr>' + ns.map(n =>
    `<tr><td>${esc(NODE_TITLE[n.nodeId] || n.name)} <span class="note" title="${esc(n.nodeId)}">${esc(n.name)}</span></td><td>${n.kind === "ext" ? "확장" : "기본"}</td>
     <td><span class="badge ${n.state === "executed" ? "b-ok" : "b-mute"}">${n.state === "executed" ? "실행" : "건너뜀"}</span></td>
     <td>${esc(n.status || "-")}</td><td>${esc(n.reason || "")}${(n.missingInputs || []).length ? " · 미확보: " + esc(n.missingInputs.join(", ")) : ""}</td></tr>`).join("") + "</table></div>";
}
function claimTable(r) {
  const cs = r.contract.claims || [];
  if (!cs.length) return '<p class="note">검증을 통과한 주장이 없습니다.</p>';
  return '<div class="tw"><table><tr><th>ID</th><th>태그</th><th>문장</th><th>근거</th><th>검증</th></tr>' + cs.map(c =>
    `<tr><td>${esc(c.claimId)}</td><td><span class="badge b-mute">${esc(c.tag || c.typeLabel || c.type)}</span>${esc(c.typeLabel || "")}</td><td>${esc(c.text)}</td>
     <td>${(c.evidenceIds || []).map(evLabel).join(", ")}</td><td>${esc((c.verification || {}).status || "")}</td></tr>`).join("") + "</table></div>";
}
function listBlock(title, items, map) {
  if (!items || !items.length) return `<h3>${title}</h3><p class="note">없음</p>`;
  return `<h3>${title} (${items.length})</h3><ul>${items.map(map).join("")}</ul>`;
}
function evidenceTable(r) {
  const ev = r.contract.evidence || [];
  if (!ev.length) return '<p class="note">근거 목록 없음</p>';
  const cols = ["evidenceId", "label", "display", "dataDate", "source"];
  return '<div class="tw"><table><tr><th>근거 ID</th><th>항목</th><th>값·제목</th><th>기준일</th><th>출처</th><th>링크</th></tr>' + ev.map(e =>
    "<tr>" + cols.map(c => c === "evidenceId" ? `<td>${evLabel(String(e[c] || ""))}</td>` : `<td>${esc(e[c] == null || typeof e[c] === "object" ? "" : e[c])}</td>`).join("") + `<td>${/^https?:\/\//.test(e.url || "") ? `<a href="${esc(e.url)}" rel="noopener noreferrer" target="_blank">링크</a>` : ""}</td></tr>`).join("") + "</table></div>";
}
function conflictBlock(cf) {
  if (!cf.length) return "<h3>관점별 충돌</h3><p class=\"note\">없음</p>";
  return `<h3>관점별 충돌 (${cf.length})</h3>` + cf.map(x => `<div class="card"><b>${esc(x.topic)}</b> <span class="note" title="${esc(x.node)}">${esc(NODE_TITLE[x.node] || "")}</span>` + (x.summary
    ? `<p>${esc(x.summary)}</p>`
    : '<div class="tw"><table><tr><th>관점</th><th>문장</th><th>성격</th><th>근거 문서</th></tr>' + x.views.map(v =>
      `<tr><td>${esc(v.head)}</td><td>${esc(v.text)}</td><td><span class="badge b-mute">${esc(v.tagKo)}</span></td><td>${esc(v.docs.join(", "))}</td></tr>`).join("") + "</table></div>") + "</div>").join("");
}
function demoView() {
  const r = D.runs[`${st.tk}|${st.ag}|${st.ext}`];
  if (!r) return '<p class="note">이 조합의 실행 결과가 없습니다.</p>';
  const c = r.contract, cf = c.conflicts || [], un = c.unverified || [];
  const ol0 = ((D.outlook || {})[st.tk] || {})[st.ag] || {}, hr0 = ol0.hitRate || {};
  const brief = briefCard(`${D.agents[st.ag]} (에이전트 ${st.ag}) 200자 요약`, c.summary200, c.summary200Method, ol0.directionLabel, ol0.direction, hr0.verdictLabel, hr0.verdict);
  const skipped = (c.nodes || []).filter(n => n.state !== "executed").length;
  let body;
  if (st.view === "screen") body = `<div class="md">${md(r.render[st.lv])}</div>`;
  else if (st.view === "nodes") body = nodeTable(r) + (c.predictionSkippedReason ? `<p class="note">예측 생략 이유: ${esc(c.predictionSkippedReason)}</p>` : "");
  else if (st.view === "claims") body = claimTable(r);
  else if (st.view === "conflict") body = conflictBlock(cf)
    + listBlock("미확보·미확인", un, x => `<li>${esc(typeof x === "string" ? x : x.item || x.text || "")}${x.reason ? ' <span class="note">(' + esc(x.reason) + ")</span>" : ""}</li>`)
    + ((c.processing || []).length ? `<h3>처리 기록</h3><p class="note">${esc(c.processing.join(" · "))} (빠진 자료가 아니라 처리 통계입니다)</p>` : "")
    + listBlock("반대 근거·하방 위험", c.downsideRisks, x => `<li>${esc(typeof x === "string" ? x : x.text || "")}</li>`);
  else body = evidenceTable(r);
  const views = [["screen", "화면(수준별)"], ["nodes", "노드 실행"], ["claims", "주장·태그"], ["conflict", "충돌·미확보"], ["evidence", "근거 목록"]];
  return brief + `<div class="kv"><div><small>상태</small><b>${statusBadge(r.status)}</b></div><div><small>노드 건너뜀</small><b>${skipped}</b></div>
    <div><small>주장 / 제거 문장</small><b>${r.claims} / ${r.removed}</b></div><div><small>LLM 시도 · 시간</small><b>${r.attempts}회 · ${r.seconds}초</b></div></div>
    <div class="sub-tabs">${views.map(([v, t]) => chip("view", v, t, st.view === v)).join("")}</div>${body}`;
}
// ---- 20거래일 전망 카드 (계약 r4-1.4 outlook): 세 에이전트 결론을 나란히, 종합은 만들지 않음
const DIR_CLS = {positive: "b-ok", neutral: "b-mute", negative: "b-bad"};
const SIG_KO = {positive: "긍정 신호", negative: "부정 신호", neutral: "기준 미달", missing: "자료 없음"};
const METHOD_KO = {llm: "LLM 요약", "llm-retry": "LLM 요약(줄여 다시 씀)", rule: "규칙 기반 요약(LLM 요약이 검사를 통과하지 못해 대체)", "node-rule": "노드 결과 규칙 요약(질의응답은 노드만 실행해 LLM 요약 없음)"};
function briefCard(title, text, method, dirLabel, direction, verdictLabel, verdict) {
  if (!text) return "";
  const n = [...text].length;
  return `<div class="card brief"><b>${esc(title)}</b> ${dirLabel ? `<span class="badge ${DIR_CLS[direction] || "b-mute"}">20거래일 ${esc(dirLabel)}</span>` : ""}${verdictLabel ? `<span class="badge ${verdict === "edge" ? "b-ok" : "b-warn"}">검증: ${esc(verdictLabel)}</span>` : ""}
  <p class="bt">${esc(text)}</p><div class="note"><span class="cnt${n > 200 ? " over" : ""}">${n}자 / 200자</span> · ${esc(METHOD_KO[method] || method || "")}</div></div>`;
}
function briefsHtml(r) {
  const cards = (r.agentBriefs || []).map(b => briefCard(`${b.agentName} (에이전트 ${b.agent})`, b.text, b.method, b.directionLabel, b.direction, b.verdictLabel, b.verdict)).join("");
  const fin = r.brief && r.brief.text ? briefCard("답 요약", r.brief.text, r.brief.method) : "";
  return cards || fin ? `<div class="card"><h2>200자 요약</h2><p class="note">에이전트가 오케스트레이터·사용자에게 주는 요약입니다(공백 포함 200자 이내, 숫자는 장부 값). 아래에 상세 답이 이어집니다.</p><div class="ol">${cards}${fin}</div></div>` : "";
}
function outlookCard(no, o) {
  const ledger = Object.entries(o.ledger || {});

function askReset(q) {

async function askLive(q) {
  A.busy = true; setBusy(); askReset(q);
  $("#ask-trace").insertAdjacentHTML("beforeend", '<p class="note" id="ask-wait">처리 중… (질문당 수십 초~2분)</p>');
  try {
    const res = await fetch("/api/ask", {method: "POST", body: JSON.stringify({question: q})});
    const rd = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const {done, value} = await rd.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!line.trim()) continue;
        const o = JSON.parse(line), w = $("#ask-wait");
        if (w) w.remove();
        if (o.event) $("#ask-trace").insertAdjacentHTML("beforeend", stepHtml(o.event));
        else if (o.result) showFinal(o.result);
        else if (o.error) $("#ask-final").innerHTML = `<div class="card"><span class="badge b-bad">오류</span> ${esc(o.error)}</div>`;
      }
    }
  } catch (e) { $("#ask-final").innerHTML = `<div class="card"><span class="badge b-bad">서버 연결 실패</span> ${esc(String(e))}</div>`; }
  A.busy = false; setBusy();
}
async function askReplay(it) {
  A.busy = true; setBusy(); askReset(it.question);
  for (const e of it.result.trace) { $("#ask-trace").insertAdjacentHTML("beforeend", stepHtml(e)); await sleep(350); }
  showFinal(it.result); A.busy = false; setBusy();
}
function setBusy() {
  document.querySelectorAll("#s-ask .go, #s-ask .chip").forEach(b => { b.disabled = A.busy || (b.classList.contains("go") && !A.live); });
  const i = $("#ask-in"); if (i) i.disabled = A.busy || !A.live;
}

      : `<span class="badge b-warn">실시간 모드 꺼짐</span> 서버 없이 열린 화면입니다. 저장된 실행 기록(${esc((D.questions || {}).ranAt || "-")}, ${QS.length}개)을 같은 흐름으로 재생합니다. 직접 질문하려면 <code>python -m qa.server</code> 를 실행하고 http://127.0.0.1:8765 로 여세요.`}</p>
    <div class="row"><input id="ask-in" type="text" maxlength="400" placeholder="${A.live ? "예: 삼성전자 최근 외국인 수급은 어때?" : "실시간 모드 꺼짐 — 아래 예시를 눌러 저장된 기록 재생"}"><button class="go" id="ask-go">묻기</button></div>
    <div class="ctl" style="margin-top:8px"><div><label class="t">예시 질문 (유형별${A.live ? " · 누르면 실제 실행" : " · 저장된 기록 재생"})</label><div class="grp">${QS.map((it, i) => `<button class="chip" data-i="${i}" title="${esc(it.question)}">${esc(it.type)} · ${esc(it.question)}</button>`).join("")}</div></div></div>
    ${A.live && QS.length ? '<label class="note"><input type="checkbox" id="ask-replay"> 예시를 저장된 기록으로 재생(실시간이 느리거나 불안정할 때)</label>' : ""}</div>
    <div class="card"><b>질문</b> <span id="ask-q" class="note">(아직 없음)</span></div><div id="ask-trace"></div><div id="ask-final"></div>`;
  setBusy();
}
$("#s-ask").addEventListener("click", e => {
  const a = e.target.closest(".evl");
  if (a) {
    e.preventDefault();
    const row = document.getElementById("ev-" + a.dataset.k);
    if (row) { row.scrollIntoView({behavior: "smooth", block: "center"}); row.classList.add("flash"); setTimeout(() => row.classList.remove("flash"), 1800); }
    return;
  }
  const c = e.target.closest(".chip");
  if (c && !A.busy) {
    const it = QS[Number(c.dataset.i)];
    if (A.live && !($("#ask-replay") || {}).checked) { $("#ask-in").value = it.question; askLive(it.question); } else askReplay(it);
    return;
  }
  if (e.target.id === "ask-go") { const q = $("#ask-in").value.trim(); if (q && !A.busy) askLive(q); }
});
$("#s-ask").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "ask-in") { const q = e.target.value.trim(); if (q && !A.busy) askLive(q); } });
renderAsk();
fetch("/api/status").then(r => r.ok ? r.json() : Promise.reject()).then(j => { if (j.live) { A.live = true; A.llm = j.llm || ""; renderAsk(); } }).catch(() => {});

// ---- 2 성능 (측정 방법·날짜·다시 재는 명령을 수치 옆에)
function perfCards() {
  const e = D.interpEval, qs = QS.map(x => x.result);
  const acc = e ? `<div class="card"><h2>질의 해석 정확도</h2><p class="note">시험셋 ${fmt(e.n)}문항을 해석기에 넣어 정답 라벨(종목·영역·의도·기간·가정·거절)과 비교한 결과입니다. 실행 ${esc(e.ran_at)} · LLM ${esc(e.llm)} · 기준일 ${esc(e.latest)}</p>
    <div class="tw"><table><tr><th>항목</th><th>정답/전체</th><th>정확도</th></tr>${Object.entries(e.accuracy).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.ok}/${v.total}</td><td>${(v.rate * 100).toFixed(0)}%</td></tr>`).join("")}</table></div>
    ${e.false_refusal ? `<p>거짓 거절 ${e.false_refusal.length}건 · 거절 누락 ${(e.missed_refusal || []).length}건</p>` : ""}
    <h3>틀린 사례 (${(e.wrong || []).length})</h3>${(e.wrong || []).length ? '<div class="tw"><table><tr><th>질문</th><th>항목</th><th>정답</th><th>실제</th></tr>' + e.wrong.map(w => `<tr><td>${esc(w.q)}</td><td>${esc(w.field)}</td><td>${esc(w.expected)}</td><td>${esc(w.got)}</td></tr>`).join("") + "</table></div>" : '<p class="note">없음</p>'}
    <p class="note">다시 재기: <code>cd members\\CH && python -m qa.eval_interp</code></p></div>` : "";
  const tm = qs.length ? `<div class="card"><h2>응답 시간·LLM 호출·토큰 (질문 유형별 실측)</h2><div class="tw"><table><tr><th>유형</th><th>질문</th><th>상태</th><th>단계</th><th>도구</th><th>LLM 호출</th><th>토큰 입력/출력</th><th>총 시간</th><th>검사 통과/제거</th></tr>${QS.map(it => {
      const r = it.result, ck = r.trace.find(x => x.kind === "답·검사");
      return `<tr><td>${esc(it.type)}</td><td>${esc(it.question)}</td><td>${esc(r.status)}</td><td>${r.trace.length}</td><td>${r.trace.filter(x => x.kind === "도구").length}</td><td>${r.usage.llm_calls}</td><td>${fmt(r.usage.input_tokens)}/${fmt(r.usage.output_tokens)}</td><td>${r.usage.total_seconds}초</td><td>${ck ? ck.kept + "/" + ck.removed.length : "-"}</td></tr>`;
    }).join("")}</table></div><p class="note">평균 ${(qs.reduce((a, r) => a + r.usage.total_seconds, 0) / qs.length).toFixed(1)}초 · 최대 ${Math.max(...qs.map(r => r.usage.total_seconds)).toFixed(1)}초 · 시간 목표 60초(넘으면 도구 호출을 멈추고 지금까지 근거로 답함). 측정 ${esc(D.questions.ranAt)}, 실제 DB·LLM.</p>
    <p class="note">다시 재기: <code>cd members\\CH && python demo\\build_demo.py questions</code> (기록을 새로 하려면 demo\\_cache\\questions.json 을 지운 뒤 실행)</p></div>` : "";
  const per = {};
  Object.values(D.runs).forEach(r => { const k = r.agentName; per[k] = per[k] || {runs: 0, claims: 0, removed: 0, att: 0}; per[k].runs++; per[k].claims += r.claims; per[k].removed += r.removed; per[k].att += r.attempts; });
  const nar = `<div class="card"><h2>에이전트 서술 품질 (4종목 실행에서 집계)</h2><div class="tw"><table><tr><th>에이전트</th><th>실행</th><th>통과 주장</th><th>제거 문장</th><th>LLM 시도</th></tr>${Object.entries(per).map(([k, v]) =>
    `<tr><td>${esc(k)}</td><td>${v.runs}</td><td>${v.claims}</td><td>${v.removed}</td><td>${v.att}</td></tr>`).join("")}</table></div>
    <p class="note">기준일 ${esc(D.meta.asOf)}, 4종목 × 확장 켬/끔 = ${D.meta.runs}회 실제 실행(LLM 포함)의 합계입니다. 제거 문장은 근거 키 오류·장부 밖 숫자·부호 불일치·금지 표현 등 점검에 걸려 화면에서 빠진 수입니다. 다시 재기: <code>python demo\\build_demo.py all ${esc(D.meta.asOf)}</code></p></div>`;
  return acc + tm + nar;
}

// ---- 2 성능: 과거 기록·감성·전망
function sentEval() {
  const e = D.sentimentEval; if (!e) return "";
  const cls = Object.entries(e.per_class), names = cls.map(([k]) => k);
  const conf = '<div class="tw"><table><tr><th>정답＼사전</th>' + names.map(n => `<th>${esc(n)}</th>`).join("") + "</tr>" + names.map(r =>
    `<tr><td>${esc(r)}</td>${names.map(c => `<td>${fmt((e.confusion[r] || {})[c])}</td>`).join("")}</tr>`).join("") + "</table></div>";
  return `<div class="card"><h2>감성 사전 평가 (사람 라벨)</h2>
  <div class="kv"><div><small>사람 라벨</small><b>${fmt(e.n_labeled)}건</b></div><div><small>감성 대상(‘무관’ ${fmt(e.n_irrelevant)}건 제외)</small><b>${fmt(e.n_scored)}건</b></div>
  <div><small>사전 정확도</small><b>${e.accuracy}%</b></div><div><small>SW 검수 후 라벨 일치도(κ)</small><b>${e.kappa_fleiss}</b></div></div>
  <p class="note">라벨러 3명이 매긴 뒤 SW 가 검수했기 때문에 κ 는 독립적인 일치도가 아니라 ‘SW 검수 후 라벨 일치도’입니다. SW 확인 ${e.n_sw_resolved}건 반영. 검증 통과가 아니라 현재 수준을 잰 결과이며, 개선 전이라 감성 기반 추론은 건너뜁니다.</p>
  <h3>클래스별</h3><div class="tw"><table><tr><th>정답 클래스</th><th>정밀도</th><th>재현율</th><th>건수</th></tr>${cls.map(([k, v]) =>
    `<tr><td>${esc(k)}</td><td>${v.precision}</td><td>${v.recall}</td><td>${fmt(v.n)}</td></tr>`).join("")}</table></div>
  <p class="note">긍정 글의 절반 가까이를 중립으로 분류합니다(긍정 과소 탐지·중립 편향).</p>
  <h3>혼동 행렬</h3>${conf}
  <h3>출처별</h3><div class="tw"><table><tr><th>출처</th><th>대상 건수</th><th>정확도</th><th>‘무관’ 비율</th></tr>${e.by_source.map(r =>
    `<tr><td>${esc(r.source)}</td><td>${fmt(r.n)}</td><td>${r.accuracy}%</td><td>${r.irrelevant}%</td></tr>`).join("")}</table></div>
  <p class="note">${esc(e.source)}</p></div>`;
}
function outlookValid() {
  const o = D.outlookValidation; if (!o) return "";
  if (o.status !== "measured") return `<div class="card"><h2>전망 규칙(outlook-r1)과 적중률</h2><p class="note">${esc(o.note)}</p></div>`;
  const pc = x => x == null ? "-" : (x * 100).toFixed(1) + "%";
  const rows = o.rows.map(r => r.unverified
    ? `<tr><td>${esc(r.name)}</td><td colspan="7"><span class="badge b-warn">미검증</span> ${esc(r.unverified)}</td></tr>`
    : `<tr><td>${esc(r.name)}</td><td><span class="badge ${r.verdict === "edge" ? "b-ok" : "b-warn"}">${esc(r.verdictLabel || "")}</span></td><td><b>${pc(r.rate)}</b> <span class="note">(${pc((r.ci95 || [])[0])}~${pc((r.ci95 || [])[1])})</span></td><td>${fmt(r.n)}</td><td>${pc(r.neutralShare)}</td><td>${pc(r.baselines.alwaysPositive)}</td><td>${pc(r.baselines.momentum)}</td><td>${pc(r.baselines.random)}</td></tr>`).join("");
  return `<div class="card"><h2>전망 규칙(${esc(o.ruleVersion)})과 과거 적중률</h2>
  <p>20거래일 뒤 KOSPI 대비 초과수익률 부호가 긍정 결론이면 양수, 부정 결론이면 음수일 때 적중으로 셉니다. 중립 결론은 적중률에서 빼고 비율만 따로 봅니다. 규칙은 결과를 보고 고치지 않았습니다.</p>
  <div class="tw"><table><tr><th>에이전트</th><th>판정</th><th>적중률 (95% 구간)</th><th>판정 건수</th><th>중립 비율</th><th>기준선: 항상 긍정</th><th>기준선: 모멘텀</th><th>기준선: 무작위</th></tr>${rows}</table></div>
  <p class="note">기준: ${esc(o.basis)} · 기준선은 같은 표본에서 비교했습니다. 판정은 95% 구간 하한이 세 기준선 중 최고값보다 커야 '우위 있음'입니다. 아래 고정 문구가 결론 옆에 붙습니다. 측정 ${esc(o.generatedAt || "")}.</p>
  ${[...new Set(o.rows.map(r => r.notice).filter(Boolean))].map(n => `<p><b>${esc(n)}</b></p>`).join("")}
  <ul>${o.limits.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
  <p class="note">계산 방식·도출 과정: ${esc(o.doc)} · 다시 계산: <code>${esc(o.command || "")}</code></p></div>`;
}
(function () {
  const v = D.validation;
  $("#s-valid").innerHTML = perfCards() + `<div class="card"><h2>제거 문장 추이 (과거 측정 기록, 각 티켓 Comments 의 값)</h2><p class="note">${esc(v.note)}</p><div class="tw"><table><tr><th>단계</th><th>제거 문장 합계</th><th>범위</th><th>설명</th></tr>${v.rows.map(r =>
    `<tr><td>${esc(r.stage)}</td><td>${esc(r.removed_total)}</td><td>${esc(r.range)}</td><td>${esc(r.note)}</td></tr>`).join("")}</table></div></div>
  ${outlookValid()}
  ${sentEval()}
  <div class="card"><h2>무엇을 뜻하나</h2><ul>${v.meaning.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>`;
})();

showTab((location.hash || "#ask").slice(1).replace(/[^a-z]/g, "") || "ask");
if (!$("#s-" + (location.hash || "").slice(1))) showTab("ask");
</script>

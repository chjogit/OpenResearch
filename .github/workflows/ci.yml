name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      # members/ 는 testpaths 밖이라 따로 돌립니다 (DB·LLM 없이 실행되는 CH 에이전트 테스트)
      - run: pytest -q members/CH/tests
      # SH 두 Agent(산업·사업모델, 기술적 분석) 테스트. DB·LLM 없이 실행
      - run: pytest -q members/SH/tests
